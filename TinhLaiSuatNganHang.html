<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>3.1.1</title>
</head>
<body>
    <script>

        let tienVay = parseFloat(prompt("Nhập số tiền vay (triệu đồng):"));
        let laiSuat = parseFloat(prompt("Nhập lãi suất (%/năm, ví dụ nhập 8 cho 8%):"));
        let soNam = parseInt(prompt("Nhập số năm vay (n):"));

   
        let tienLaiMotNam = tienVay * (laiSuat / 100);
        let tongTien = tienVay + soNam * tienLaiMotNam;

   
        alert("Số tiền phải trả sau " + soNam + " năm là: " + tongTien + " (triệu đồng)");
    </script>
</body>
</html>
