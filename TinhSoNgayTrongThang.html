<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>3.2.3</title>
    <style>
        .container {
            width: 300px;
            border: 1px solid #999;
            padding: 15px;
            margin: 20px auto;
            font-family: "Times New Roman", Times, serif;
            background-color: #f9f9f9;
        }
        .input-group {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
        }
        input[type="number"] {
            width: 160px;
            padding: 4px;
        }
        button {
            padding: 4px 10px;
            cursor: pointer;
        }
        #ketQua {
            font-size: 18px;
            margin: 0;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="input-group">
        <input type="number" id="thang" placeholder="Nhập tháng (1-12)">
        <button onclick="tinhSoNgay()">Tính số ngày</button>
    </div>
    <p id="ketQua"></p>
</div>

<script>
    function tinhSoNgay() {
      
        let thang = parseInt(document.getElementById("thang").value);
        let hienThi = document.getElementById("ketQua");

        
        switch (thang) {
            case 1:
            case 3:
            case 5:
            case 7:
            case 8:
            case 10:
            case 12:
                hienThi.innerText = "Tháng " + thang + " có 31 ngày";
                break;

            case 4:
            case 6:
            case 9:
            case 11:
                hienThi.innerText = "Tháng " + thang + " có 30 ngày";
                break;

            case 2:
                hienThi.innerText = "Tháng 2 có 28 hoặc 29 ngày";
                break;

            default:
                hienThi.innerText = "Vui lòng nhập tháng hợp lệ (từ 1 đến 12)!";
        }
    }
</script>

</body>
</html>
